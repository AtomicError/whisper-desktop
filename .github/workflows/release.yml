name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-24.04]

    runs-on: ${{ matrix.platform }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux system dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libglib2.0-dev \
            pkg-config \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            ffmpeg

      - name: Install frontend dependencies
        run: npm install

      - name: Build Tauri Application
        run: npm run tauri build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NO_STRIP: true

      - name: Fix AppImage Graphics Libraries
        shell: bash
        run: |
          # 1. Download appimagetool from the official continuous release
          wget -q -O appimagetool https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool

          # 2. Extract appimagetool to bypass FUSE requirement on the runner
          ./appimagetool --appimage-extract
          mv squashfs-root appimagetool-temp

          # 3. Find the generated AppImage
          APPIMAGE_PATH=$(find src-tauri/target/release/bundle/appimage/ -name "*.AppImage" | head -n 1)
          echo "Found AppImage at: $APPIMAGE_PATH"

          # 4. Extract the app's AppImage
          chmod +x $APPIMAGE_PATH
          ./$APPIMAGE_PATH --appimage-extract
          
          # 5. Remove the conflicting graphics libraries from the extracted squashfs-root
          echo "Removing conflicting graphics libraries..."
          rm -f squashfs-root/usr/lib/libEGL.so*
          rm -f squashfs-root/usr/lib/libGL.so*
          rm -f squashfs-root/usr/lib/libgbm.so*
          rm -f squashfs-root/usr/lib/libglapi.so*
          rm -f squashfs-root/usr/lib/libwayland-client.so*
          
          rm -f squashfs-root/usr/lib/x86_64-linux-gnu/libEGL.so*
          rm -f squashfs-root/usr/lib/x86_64-linux-gnu/libGL.so*
          rm -f squashfs-root/usr/lib/x86_64-linux-gnu/libgbm.so*
          rm -f squashfs-root/usr/lib/x86_64-linux-gnu/libglapi.so*
          rm -f squashfs-root/usr/lib/x86_64-linux-gnu/libwayland-client.so*

          # 6. Remove the old AppImage file
          rm -f $APPIMAGE_PATH

          # 7. Re-package the AppImage using the extracted appimagetool
          echo "Re-packaging AppImage..."
          export ARCH=x86_64
          ./appimagetool-temp/AppRun squashfs-root $APPIMAGE_PATH

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: 'Whisper Desktop ${{ github.ref_name }}'
          body: 'To download Whisper Desktop for your platform, please see the assets below. Enjoy local, private speech-to-text transcription!'
          draft: true
          prerelease: false
          files: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
