name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-22.04]

    runs-on: ${{ matrix.platform }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux system dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libglib2.0-dev \
            pkg-config \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            ffmpeg \
            libvulkan-dev \
            glslc \
            glslang-tools \
            spirv-headers \
            xdg-utils

      - name: Install CUDA Toolkit
        uses: Jimver/cuda-toolkit@v0.2.35
        id: cuda-toolkit
        with:
          cuda: '12.5.0'
          method: 'network'

      - name: Add Intel APT Repository for OpenVINO
        run: |
          wget https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB
          sudo gpg --dearmor -o /usr/share/keyrings/intel-openvino.gpg GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB
          echo "deb [signed-by=/usr/share/keyrings/intel-openvino.gpg] https://apt.repos.intel.com/openvino ubuntu22 main" | sudo tee /etc/apt/sources.list.d/intel-openvino.list
          sudo apt update
          sudo apt-get install -y libopenvino-dev-2024.2.0

      - name: Install frontend dependencies
        run: npm install

      - name: Clone whisper.cpp repository
        run: |
          LATEST_TAG=$(git ls-remote --tags --refs https://github.com/ggml-org/whisper.cpp.git | awk -F/ '{print $3}' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)
          echo "Detected latest release tag: $LATEST_TAG"
          git clone --depth 1 --branch "$LATEST_TAG" https://github.com/ggml-org/whisper.cpp.git whisper.cpp-src

      - name: Compile whisper.cpp acceleration backends
        run: |
          mkdir -p src-tauri/resources
          
          # 1. Standard CPU Backend
          echo "Building Standard CPU backend..."
          cmake -B whisper.cpp-src/build-standard -S whisper.cpp-src -DCMAKE_BUILD_TYPE=Release -DGGML_OPENMP=ON -DBUILD_SHARED_LIBS=OFF
          cmake --build whisper.cpp-src/build-standard -j$(nproc) --config Release --target whisper-cli
          cp whisper.cpp-src/build-standard/bin/whisper-cli src-tauri/resources/whisper-cli-standard
          
          # 2. Vulkan Backend
          echo "Building Vulkan backend..."
          cmake -B whisper.cpp-src/build-vulkan -S whisper.cpp-src -DCMAKE_BUILD_TYPE=Release -DGGML_OPENMP=ON -DGGML_VULKAN=ON -DBUILD_SHARED_LIBS=OFF
          cmake --build whisper.cpp-src/build-vulkan -j$(nproc) --config Release --target whisper-cli
          cp whisper.cpp-src/build-vulkan/bin/whisper-cli src-tauri/resources/whisper-cli-vulkan
          
          # 3. OpenVINO Backend
          echo "Building OpenVINO backend..."
          cmake -B whisper.cpp-src/build-openvino -S whisper.cpp-src -DCMAKE_BUILD_TYPE=Release -DGGML_OPENMP=ON -DWHISPER_OPENVINO=1 -DBUILD_SHARED_LIBS=OFF
          cmake --build whisper.cpp-src/build-openvino -j$(nproc) --config Release --target whisper-cli
          cp whisper.cpp-src/build-openvino/bin/whisper-cli src-tauri/resources/whisper-cli-openvino
          
          # 4. CUDA Backend
          echo "Building CUDA backend..."
          cmake -B whisper.cpp-src/build-cuda -S whisper.cpp-src -DCMAKE_BUILD_TYPE=Release -DGGML_OPENMP=ON -DGGML_CUDA=ON -DBUILD_SHARED_LIBS=OFF
          cmake --build whisper.cpp-src/build-cuda -j$(nproc) --config Release --target whisper-cli
          cp whisper.cpp-src/build-cuda/bin/whisper-cli src-tauri/resources/whisper-cli-cuda
          chmod +x src-tauri/resources/whisper-cli-*

      - name: Cache FFmpeg Binaries
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: |
            src-tauri/resources/ffmpeg*
            src-tauri/resources/ffprobe*
          key: ffmpeg-release-linux-x64-v2

      - name: Download Static FFmpeg and FFprobe
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: |
          echo "Downloading static standalone FFmpeg and FFprobe for Linux x64..."
          wget -q https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz
          tar -xJf ffmpeg-release-amd64-static.tar.xz --wildcards --strip-components=1 -C src-tauri/resources/ "ffmpeg-*-amd64-static/ffmpeg" "ffmpeg-*-amd64-static/ffprobe"
          rm -f ffmpeg-release-amd64-static.tar.xz
          chmod +x src-tauri/resources/ffmpeg src-tauri/resources/ffprobe

      - name: Build Tauri Application
        run: npm run tauri build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NO_STRIP: true

      - name: Fix AppImage Graphics Libraries
        shell: bash
        run: |
          # 1. Download appimagetool from the official continuous release
          wget -q -O appimagetool https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool

          # 2. Extract appimagetool to bypass FUSE requirement on the runner
          ./appimagetool --appimage-extract
          mv squashfs-root appimagetool-temp

          # 3. Find the generated AppImage
          APPIMAGE_PATH=$(find src-tauri/target/release/bundle/appimage/ -name "*.AppImage" | head -n 1)
          echo "Found AppImage at: $APPIMAGE_PATH"

          # 4. Extract the app's AppImage
          chmod +x "$APPIMAGE_PATH"
          "$APPIMAGE_PATH" --appimage-extract
          
          # 5. Remove the conflicting graphics libraries from the extracted squashfs-root
          echo "Removing conflicting graphics libraries..."
          rm -f squashfs-root/usr/lib/libEGL.so*
          rm -f squashfs-root/usr/lib/libGL.so*
          rm -f squashfs-root/usr/lib/libgbm.so*
          rm -f squashfs-root/usr/lib/libglapi.so*
          rm -f squashfs-root/usr/lib/libwayland-client.so*
          
          rm -f squashfs-root/usr/lib/x86_64-linux-gnu/libEGL.so*
          rm -f squashfs-root/usr/lib/x86_64-linux-gnu/libGL.so*
          rm -f squashfs-root/usr/lib/x86_64-linux-gnu/libgbm.so*
          rm -f squashfs-root/usr/lib/x86_64-linux-gnu/libglapi.so*
          rm -f squashfs-root/usr/lib/x86_64-linux-gnu/libwayland-client.so*

          # 6. Remove the old AppImage file
          rm -f "$APPIMAGE_PATH"

          # 7. Re-package the AppImage using the extracted appimagetool
          echo "Re-packaging AppImage..."
          export ARCH=x86_64
          ./appimagetool-temp/AppRun squashfs-root "$APPIMAGE_PATH"

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: 'Whisper Desktop ${{ github.ref_name }}'
          body: |
            ## Whisper Desktop ${{ github.ref_name }} 🎙️

            A high-performance, private, and offline speech-to-text desktop application powered by `whisper.cpp` and `Tauri`.

            ### 📦 Download & Package Guide

            | Platform | Architecture / Format | Target File | Notes |
            | :--- | :--- | :--- | :--- |
            | 🪟 **Windows** | Setup Installer (x64) | `WhisperDesktop_*_x64-setup.exe` | Compatible with Intel/AMD & Windows on ARM |
            | 🪟 **Windows** | MSI Package (x64) | `WhisperDesktop_*_x64_en-US.msi` | Enterprise & System-wide deployment |
            | 🍎 **macOS** | Universal DMG | `WhisperDesktop_*_universal.dmg` | Native on Apple Silicon (M1-M4) & Intel |
            | 🐧 **Linux** | Portable AppImage (x86_64) | `WhisperDesktop_*_amd64.AppImage` | Standalone executable for Intel/AMD |
            | 🐧 **Linux** | Portable AppImage (ARM64) | `WhisperDesktop_*_aarch64.AppImage` | Standalone executable for ARM64 |
            | 🐧 **Linux (Debian/Ubuntu)** | DEB Package (Intel/AMD) | `WhisperDesktop_*_amd64.deb` | Standard package for Ubuntu/Debian |
            | 🐧 **Linux (Debian/Ubuntu)** | DEB Package (ARM64) | `WhisperDesktop_*_arm64.deb` | Standard package for ARM64 |
            | 🐧 **Linux (Fedora/RHEL)** | RPM Package (x86_64) | `WhisperDesktop-*-1.x86_64.rpm` | Red Hat / Fedora / openSUSE |
            | 🐧 **Linux (Fedora/RHEL)** | RPM Package (ARM64) | `WhisperDesktop-*-1.aarch64.rpm` | Red Hat / Fedora on ARM64 |

            ---
            > 💡 **Windows on ARM:** Windows 11 ARM64 devices (Snapdragon X Elite, Surface Pro, etc.) run the `x64-setup.exe` installer with near-native performance via Microsoft Prism emulation.
            > 💡 **macOS Universal:** The DMG package contains a Universal binary natively optimized for both Apple Silicon (M1/M2/M3/M4) and Intel Macs.
          draft: true
          prerelease: false
          files: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
