name: Release & Build Cross-Platform

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-tauri:
    name: build-tauri (${{ matrix.platform }}, ${{ matrix.arch }})
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'ubuntu-22.04'
            arch: 'x86_64'
            args: ''
            rust-target: ''
          - platform: 'ubuntu-24.04-arm'
            arch: 'arm64'
            args: ''
            rust-target: ''
          - platform: 'windows-2022'
            arch: 'x86_64'
            args: ''
            rust-target: ''
          - platform: 'macos-latest'
            arch: 'universal'
            args: '--target universal-apple-darwin'
            rust-target: 'x86_64-apple-darwin,aarch64-apple-darwin'

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux dependencies (Ubuntu x86_64)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          wget -qO- https://packages.lunarg.com/lunarg-signing-key-pub.asc | sudo tee /etc/apt/trusted.gpg.d/lunarg.asc
          sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan-jammy.list http://packages.lunarg.com/vulkan/lunarg-vulkan-jammy.list
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            rpm \
            libglib2.0-dev \
            libunwind-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libgstreamer-plugins-bad1.0-dev \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-libav \
            gstreamer1.0-gl \
            gstreamer1.0-alsa \
            gstreamer1.0-pipewire \
            pkg-config \
            xdg-utils \
            file \
            build-essential \
            cmake \
            vulkan-sdk

      - name: Install Vulkan SDK (Windows)
        if: matrix.platform == 'windows-2022'
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          vulkan_version: latest
          cache: true

      - name: Install CUDA Toolkit (Windows)
        if: matrix.platform == 'windows-2022'
        uses: Jimver/cuda-toolkit@v0.2.35
        id: cuda-toolkit-windows
        with:
          cuda: '12.8.0'
          method: 'network'
          sub-packages: '["nvcc", "cudart", "cublas", "cublas_dev", "visual_studio_integration"]'

      - name: Install CUDA Toolkit (Ubuntu x86_64)
        if: matrix.platform == 'ubuntu-22.04'
        uses: Jimver/cuda-toolkit@v0.2.35
        id: cuda-toolkit
        with:
          cuda: '12.5.0'
          method: 'network'

      - name: Add Intel APT Repository for OpenVINO (Ubuntu x86_64)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          wget -q https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB
          sudo gpg --dearmor -o /usr/share/keyrings/intel-openvino.gpg GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB
          echo "deb [signed-by=/usr/share/keyrings/intel-openvino.gpg] https://apt.repos.intel.com/openvino ubuntu22 main" | sudo tee /etc/apt/sources.list.d/intel-openvino.list

          wget -qO - https://repositories.intel.com/gpu/intel-graphics.key | sudo gpg --yes --dearmor -o /usr/share/keyrings/intel-graphics.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/intel-graphics.gpg] https://repositories.intel.com/gpu/ubuntu jammy client" | sudo tee /etc/apt/sources.list.d/intel-gpu-jammy.list

          sudo apt-get update
          sudo apt-get install -y \
            libopenvino-dev-2024.2.0 \
            libopenvino-intel-cpu-plugin-2024.2.0 \
            libopenvino-intel-gpu-plugin-2024.2.0 \
            libopenvino-auto-plugin-2024.2.0 \
            libopenvino-auto-batch-plugin-2024.2.0 \
            libopenvino-hetero-plugin-2024.2.0 \
            ocl-icd-libopencl1 \
            libze1

      - name: Install Linux dependencies (Ubuntu ARM64)
        if: matrix.platform == 'ubuntu-24.04-arm'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            rpm \
            libglib2.0-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libgstreamer-plugins-bad1.0-dev \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-libav \
            gstreamer1.0-gl \
            gstreamer1.0-alsa \
            gstreamer1.0-pipewire \
            pkg-config \
            xdg-utils \
            file \
            build-essential \
            cmake \
            libvulkan-dev \
            glslc \
            glslang-tools \
            spirv-headers

      - name: Install frontend dependencies
        run: npm ci

      # --- WHISPER.CPP BINARIES COMPILATION & CACHING ---

      - name: Detect Latest whisper.cpp Tag
        id: whisper_tag
        shell: bash
        run: |
          LATEST_TAG=$(git ls-remote --tags --refs https://github.com/ggml-org/whisper.cpp.git | awk -F/ '{print $3}' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)
          if [ -z "$LATEST_TAG" ]; then
            LATEST_TAG="v1.7.4"
          fi
          echo "tag=$LATEST_TAG" >> $GITHUB_OUTPUT
          echo "WHISPER_CPP_VERSION=$LATEST_TAG" >> $GITHUB_ENV
          echo "Detected whisper.cpp tag: $LATEST_TAG"

      - name: Cache Whisper Binaries
        id: whisper-cache
        uses: actions/cache@v4
        with:
          path: |
            whisper-bins/**
            openvino-dlls/**
            openvino-libs/**
            cuda-dlls/**
            cuda-libs/**
          key: whisper-bin-${{ matrix.platform }}-${{ matrix.arch }}-${{ steps.whisper_tag.outputs.tag }}-v10

      - name: Clone whisper.cpp
        if: steps.whisper-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          git clone --depth 1 --branch "${{ steps.whisper_tag.outputs.tag }}" https://github.com/ggml-org/whisper.cpp.git whisper.cpp-src

      - name: Compile Whisper CLI (Linux x86_64)
        if: matrix.platform == 'ubuntu-22.04' && steps.whisper-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p whisper-bins/universal whisper-bins/cuda openvino-libs cuda-libs

          # 1. Standard CPU Backend (with all CPU variants via Dynamic Dispatch)
          echo "Building Standard CPU backend with Dynamic Dispatch..."
          cmake -B whisper.cpp-src/build-standard -S whisper.cpp-src \
            -DCMAKE_BUILD_TYPE=Release \
            -DGGML_OPENMP=ON \
            -DGGML_BACKEND_DL=ON \
            -DGGML_CPU_ALL_VARIANTS=ON \
            -DGGML_NATIVE=OFF \
            -DBUILD_SHARED_LIBS=ON \
            -DCMAKE_INSTALL_RPATH='$ORIGIN:$ORIGIN/..' \
            -DCMAKE_BUILD_WITH_INSTALL_RPATH=ON
          cmake --build whisper.cpp-src/build-standard -j$(nproc) --config Release --target whisper-cli

          # 2. Vulkan Backend
          echo "Building Vulkan backend..."
          cmake -B whisper.cpp-src/build-vulkan -S whisper.cpp-src \
            -DCMAKE_BUILD_TYPE=Release \
            -DGGML_OPENMP=ON \
            -DGGML_VULKAN=ON \
            -DGGML_BACKEND_DL=ON \
            -DGGML_CPU_ALL_VARIANTS=ON \
            -DGGML_NATIVE=OFF \
            -DBUILD_SHARED_LIBS=ON \
            -DCMAKE_INSTALL_RPATH='$ORIGIN:$ORIGIN/..' \
            -DCMAKE_BUILD_WITH_INSTALL_RPATH=ON
          cmake --build whisper.cpp-src/build-vulkan -j$(nproc) --config Release --target whisper-cli

          # 3. OpenVINO Backend
          echo "Building OpenVINO backend..."
          cmake -B whisper.cpp-src/build-openvino -S whisper.cpp-src \
            -DCMAKE_BUILD_TYPE=Release \
            -DGGML_OPENMP=ON \
            -DWHISPER_OPENVINO=1 \
            -DGGML_BACKEND_DL=ON \
            -DGGML_CPU_ALL_VARIANTS=ON \
            -DGGML_NATIVE=OFF \
            -DBUILD_SHARED_LIBS=ON \
            -DCMAKE_INSTALL_RPATH='$ORIGIN:$ORIGIN/..' \
            -DCMAKE_BUILD_WITH_INSTALL_RPATH=ON
          cmake --build whisper.cpp-src/build-openvino -j$(nproc) --config Release --target whisper-cli

          # 4. CUDA Backend
          echo "Building CUDA backend..."
          cmake -B whisper.cpp-src/build-cuda -S whisper.cpp-src \
            -DCMAKE_BUILD_TYPE=Release \
            -DGGML_OPENMP=ON \
            -DGGML_CUDA=ON \
            -DGGML_BACKEND_DL=ON \
            -DGGML_CPU_ALL_VARIANTS=ON \
            -DGGML_NATIVE=OFF \
            -DBUILD_SHARED_LIBS=ON \
            -DCMAKE_INSTALL_RPATH='$ORIGIN:$ORIGIN/..' \
            -DCMAKE_BUILD_WITH_INSTALL_RPATH=ON
          cmake --build whisper.cpp-src/build-cuda -j$(nproc) --config Release --target whisper-cli

          # Harvest OpenVINO runtime shared libraries from system
          find /usr/lib -name "libopenvino*.so*" -exec cp -d {} openvino-libs/ \; 2>/dev/null || true
          find /usr/lib -name "cache.json" -exec cp -d {} openvino-libs/ \; 2>/dev/null || true
          find /usr/lib -name "libtbb*.so*" -exec cp -d {} openvino-libs/ \; 2>/dev/null || true
          find openvino-libs -xtype l -delete 2>/dev/null || true

          # Harvest CUDA runtime shared libraries from system (cudart, cublas, cublasLt, nvJitLink)
          find /usr/local/cuda* -name "libcudart.so*" -exec cp -d {} cuda-libs/ \; 2>/dev/null || true
          find /usr/local/cuda* -name "libcublas*.so*" -exec cp -d {} cuda-libs/ \; 2>/dev/null || true
          find /usr/local/cuda* -name "libnvJitLink*.so*" -exec cp -d {} cuda-libs/ \; 2>/dev/null || true
          # Dynamic ldd dependency resolution: resolve and copy any other CUDA runtime dependencies
          ldd whisper.cpp-src/build-cuda/bin/libggml-cuda.so 2>/dev/null | grep "/usr/local/cuda" | awk '{print $3}' | while read -r lib; do
            [ -f "$lib" ] && cp -d "$lib"* cuda-libs/ 2>/dev/null || true
          done

          # Populate Universal Edition folder (Standard + Vulkan + OpenVINO)
          mkdir -p whisper-bins/universal/standard whisper-bins/universal/vulkan whisper-bins/universal/openvino
          # 1. Standard
          cp whisper.cpp-src/build-standard/bin/whisper-cli whisper-bins/universal/standard/whisper-cli-standard
          cp -d whisper.cpp-src/build-standard/bin/*.so* whisper-bins/universal/standard/ 2>/dev/null || true
          # 2. Vulkan
          cp whisper.cpp-src/build-vulkan/bin/whisper-cli whisper-bins/universal/vulkan/whisper-cli-vulkan
          cp -d whisper.cpp-src/build-vulkan/bin/*.so* whisper-bins/universal/vulkan/ 2>/dev/null || true
          # 3. OpenVINO
          cp whisper.cpp-src/build-openvino/bin/whisper-cli whisper-bins/universal/openvino/whisper-cli-openvino
          cp -d whisper.cpp-src/build-openvino/bin/*.so* whisper-bins/universal/openvino/ 2>/dev/null || true
          cp -d openvino-libs/*.so* whisper-bins/universal/openvino/ 2>/dev/null || true
          cp -d openvino-libs/cache.json whisper-bins/universal/openvino/ 2>/dev/null || true

          # Populate CUDA Edition folder (Standard + Vulkan + CUDA)
          mkdir -p whisper-bins/cuda/standard whisper-bins/cuda/vulkan whisper-bins/cuda/cuda
          # 1. Standard
          cp whisper.cpp-src/build-standard/bin/whisper-cli whisper-bins/cuda/standard/whisper-cli-standard
          cp -d whisper.cpp-src/build-standard/bin/*.so* whisper-bins/cuda/standard/ 2>/dev/null || true
          # 2. Vulkan
          cp whisper.cpp-src/build-vulkan/bin/whisper-cli whisper-bins/cuda/vulkan/whisper-cli-vulkan
          cp -d whisper.cpp-src/build-vulkan/bin/*.so* whisper-bins/cuda/vulkan/ 2>/dev/null || true
          # 3. CUDA
          cp whisper.cpp-src/build-cuda/bin/whisper-cli whisper-bins/cuda/cuda/whisper-cli-cuda
          cp -d whisper.cpp-src/build-cuda/bin/*.so* whisper-bins/cuda/cuda/ 2>/dev/null || true
          cp -d cuda-libs/*.so* whisper-bins/cuda/cuda/ 2>/dev/null || true

          chmod -R 755 whisper-bins/ 2>/dev/null || true

      - name: Compile Whisper CLI (Linux ARM64)
        if: matrix.platform == 'ubuntu-24.04-arm' && steps.whisper-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p whisper-bins

          # 1. Standard CPU Backend (NEON Accelerated)
          echo "Building Standard ARM64 CPU backend..."
          cmake -B whisper.cpp-src/build-standard -S whisper.cpp-src -DCMAKE_BUILD_TYPE=Release -DGGML_OPENMP=ON -DBUILD_SHARED_LIBS=OFF -DGGML_NATIVE=OFF
          cmake --build whisper.cpp-src/build-standard -j$(nproc) --config Release --target whisper-cli
          cp whisper.cpp-src/build-standard/bin/whisper-cli whisper-bins/whisper-cli-standard

          # 2. Vulkan Backend
          echo "Building Vulkan ARM64 backend..."
          cmake -B whisper.cpp-src/build-vulkan -S whisper.cpp-src -DCMAKE_BUILD_TYPE=Release -DGGML_OPENMP=ON -DGGML_VULKAN=ON -DBUILD_SHARED_LIBS=OFF -DGGML_NATIVE=OFF
          cmake --build whisper.cpp-src/build-vulkan -j$(nproc) --config Release --target whisper-cli
          cp whisper.cpp-src/build-vulkan/bin/whisper-cli whisper-bins/whisper-cli-vulkan

          # Fallbacks for OpenVINO/CUDA
          cp whisper-bins/whisper-cli-standard whisper-bins/whisper-cli-openvino
          cp whisper-bins/whisper-cli-standard whisper-bins/whisper-cli-cuda

          chmod +x whisper-bins/whisper-cli-*

      - name: Compile Whisper CLI (Windows x64)
        if: matrix.platform == 'windows-2022' && steps.whisper-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path whisper-bins/universal
          New-Item -ItemType Directory -Force -Path whisper-bins/cuda
          New-Item -ItemType Directory -Force -Path openvino-dlls
          New-Item -ItemType Directory -Force -Path cuda-dlls

          # 1. Standard CPU Backend (with all CPU variants via Dynamic Dispatch)
          Write-Host "Building Standard CPU backend for Windows with Dynamic Dispatch..."
          cmake -G "Visual Studio 17 2022" -A x64 -B whisper.cpp-src/build-standard -S whisper.cpp-src `
            -DCMAKE_BUILD_TYPE=Release `
            -DGGML_OPENMP=ON `
            -DGGML_BACKEND_DL=ON `
            -DGGML_CPU_ALL_VARIANTS=ON `
            -DGGML_NATIVE=OFF `
            -DBUILD_SHARED_LIBS=ON
          cmake --build whisper.cpp-src/build-standard -j --config Release --target whisper-cli

          # 2. Vulkan Backend
          Write-Host "Building Vulkan backend for Windows..."
          cmake -G "Visual Studio 17 2022" -A x64 -B whisper.cpp-src/build-vulkan -S whisper.cpp-src `
            -DCMAKE_BUILD_TYPE=Release `
            -DGGML_VULKAN=ON `
            -DGGML_BACKEND_DL=ON `
            -DGGML_CPU_ALL_VARIANTS=ON `
            -DGGML_NATIVE=OFF `
            -DBUILD_SHARED_LIBS=ON
          cmake --build whisper.cpp-src/build-vulkan -j --config Release --target whisper-cli

          # Copy Vulkan Runtime Loader DLL
          if ($env:VULKAN_SDK -and (Test-Path "$env:VULKAN_SDK\Bin\vulkan-1.dll")) {
            Copy-Item "$env:VULKAN_SDK\Bin\vulkan-1.dll" "whisper-bins/vulkan-1.dll" -Force
            Write-Host "vulkan-1.dll bundled from Vulkan SDK."
          } elseif (Test-Path "C:\Windows\System32\vulkan-1.dll") {
            Copy-Item "C:\Windows\System32\vulkan-1.dll" "whisper-bins/vulkan-1.dll" -Force
            Write-Host "vulkan-1.dll bundled from System32."
          }

          # 3. OpenVINO Backend (Intel CPU / iGPU Acceleration)
          Write-Host "Setting up OpenVINO 2024 for Windows..."
          $openvinoUrl = "https://storage.openvinotoolkit.org/repositories/openvino/packages/2024.2/windows/w_openvino_toolkit_windows_2024.2.0.15519.5c0f38f83f6_x86_64.zip"
          Invoke-WebRequest -Uri $openvinoUrl -OutFile "openvino.zip"
          7z x openvino.zip -oopenvino-extracted -y
          $openvinoDir = Get-ChildItem -Path "openvino-extracted" -Directory | Select-Object -First 1

          Write-Host "Building OpenVINO backend for Windows..."
          cmake -G "Visual Studio 17 2022" -A x64 -B whisper.cpp-src/build-openvino -S whisper.cpp-src `
            -DCMAKE_BUILD_TYPE=Release `
            -DGGML_OPENMP=ON `
            -DWHISPER_OPENVINO=1 `
            -DOpenVINO_DIR="$($openvinoDir.FullName)/runtime/cmake" `
            -DGGML_BACKEND_DL=ON `
            -DGGML_CPU_ALL_VARIANTS=ON `
            -DGGML_NATIVE=OFF `
            -DBUILD_SHARED_LIBS=ON
          cmake --build whisper.cpp-src/build-openvino -j --config Release --target whisper-cli

          # Copy OpenVINO & TBB runtime DLLs to dedicated cache folder
          Get-ChildItem -Path "$($openvinoDir.FullName)/runtime/bin/intel64/Release/*.dll" | Copy-Item -Destination openvino-dlls/ -Force
          Get-ChildItem -Path "$($openvinoDir.FullName)/runtime/bin/intel64/Release/cache.json" -ErrorAction SilentlyContinue | Copy-Item -Destination openvino-dlls/ -Force
          Get-ChildItem -Path "$($openvinoDir.FullName)/runtime/3rdparty/tbb/bin/*.dll" -ErrorAction SilentlyContinue | Copy-Item -Destination openvino-dlls/ -Force
          Remove-Item -Recurse -Force "openvino.zip", "openvino-extracted"

          # 4. CUDA Backend (NVIDIA GPU Acceleration)
          Write-Host "Building CUDA backend for Windows..."
          $env:CUDACXX = "$env:CUDA_PATH\bin\nvcc.exe"
          $vsWhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (Test-Path $vsWhere) {
            $vsPath = & $vsWhere -latest -version "[17.0,18.0)" -property installationPath
            if (-not $vsPath) {
              $vsPath = & $vsWhere -latest -property installationPath
            }
            $msbuildDirs = Get-ChildItem -Path "$vsPath\MSBuild\Microsoft\VC" -Directory -Recurse -Filter "BuildCustomizations" -ErrorAction SilentlyContinue
            $cudaMsbuild = "$env:CUDA_PATH\extras\visual_studio_integration\MSBuildExtensions"
            if (Test-Path $cudaMsbuild) {
              foreach ($dir in $msbuildDirs) {
                Copy-Item -Path "$cudaMsbuild\*" -Destination $dir.FullName -Force -ErrorAction SilentlyContinue
              }
            }
          }

          cmake -G "Visual Studio 17 2022" -A x64 -B whisper.cpp-src/build-cuda -S whisper.cpp-src `
            -DCMAKE_BUILD_TYPE=Release `
            -DGGML_CUDA=ON `
            -DGGML_OPENMP=ON `
            -DCUDAToolkit_ROOT="$env:CUDA_PATH" `
            -DCMAKE_CUDA_FLAGS="-allow-unsupported-compiler" `
            -DGGML_BACKEND_DL=ON `
            -DGGML_CPU_ALL_VARIANTS=ON `
            -DGGML_NATIVE=OFF `
            -DBUILD_SHARED_LIBS=ON
          cmake --build whisper.cpp-src/build-cuda -j --config Release --target whisper-cli

          # 5. CUDA runtime DLLs
          if ($env:CUDA_PATH) {
            Copy-Item "$env:CUDA_PATH\bin\cublas64_*.dll" cuda-dlls/ -ErrorAction SilentlyContinue -Force
            Copy-Item "$env:CUDA_PATH\bin\cublasLt64_*.dll" cuda-dlls/ -ErrorAction SilentlyContinue -Force
            Copy-Item "$env:CUDA_PATH\bin\cudart64_*.dll" cuda-dlls/ -ErrorAction SilentlyContinue -Force
            Copy-Item "$env:CUDA_PATH\bin\nvJitLink*.dll" cuda-dlls/ -ErrorAction SilentlyContinue -Force
          }

          # Copy OpenMP runtime (vcomp140.dll)
          $vcompDll = Get-ChildItem -Path "$env:ProgramFiles/Microsoft Visual Studio" -Filter "vcomp140.dll" -Recurse -ErrorAction SilentlyContinue | Where-Object { $_.FullName -match "x64" } | Select-Object -First 1

          # Populate Universal Edition folder (Standard + Vulkan + OpenVINO)
          New-Item -ItemType Directory -Force -Path "whisper-bins/universal/standard"
          New-Item -ItemType Directory -Force -Path "whisper-bins/universal/vulkan"
          New-Item -ItemType Directory -Force -Path "whisper-bins/universal/openvino"

          # 1. Standard
          Copy-Item "whisper.cpp-src/build-standard/bin/Release/whisper-cli.exe" "whisper-bins/universal/standard/whisper-cli-standard.exe" -Force
          Get-ChildItem -Path "whisper.cpp-src/build-standard/bin/Release/*.dll" | Copy-Item -Destination "whisper-bins/universal/standard/" -Force
          if ($vcompDll) { Copy-Item $vcompDll.FullName "whisper-bins/universal/standard/" -Force }

          # 2. Vulkan
          Copy-Item "whisper.cpp-src/build-vulkan/bin/Release/whisper-cli.exe" "whisper-bins/universal/vulkan/whisper-cli-vulkan.exe" -Force
          Get-ChildItem -Path "whisper.cpp-src/build-vulkan/bin/Release/*.dll" | Copy-Item -Destination "whisper-bins/universal/vulkan/" -Force
          if (Test-Path "whisper-bins/vulkan-1.dll") { Copy-Item "whisper-bins/vulkan-1.dll" "whisper-bins/universal/vulkan/" -Force }
          if ($vcompDll) { Copy-Item $vcompDll.FullName "whisper-bins/universal/vulkan/" -Force }

          # 3. OpenVINO
          Copy-Item "whisper.cpp-src/build-openvino/bin/Release/whisper-cli.exe" "whisper-bins/universal/openvino/whisper-cli-openvino.exe" -Force
          Get-ChildItem -Path "whisper.cpp-src/build-openvino/bin/Release/*.dll" | Copy-Item -Destination "whisper-bins/universal/openvino/" -Force
          Get-ChildItem -Path "openvino-dlls/*.dll" -ErrorAction SilentlyContinue | Copy-Item -Destination "whisper-bins/universal/openvino/" -Force
          if (Test-Path "openvino-dlls/cache.json") { Copy-Item "openvino-dlls/cache.json" "whisper-bins/universal/openvino/" -Force }
          if ($vcompDll) { Copy-Item $vcompDll.FullName "whisper-bins/universal/openvino/" -Force }

          # Populate CUDA Edition folder (Standard + Vulkan + CUDA)
          New-Item -ItemType Directory -Force -Path "whisper-bins/cuda/standard"
          New-Item -ItemType Directory -Force -Path "whisper-bins/cuda/vulkan"
          New-Item -ItemType Directory -Force -Path "whisper-bins/cuda/cuda"

          # 1. Standard
          Copy-Item "whisper.cpp-src/build-standard/bin/Release/whisper-cli.exe" "whisper-bins/cuda/standard/whisper-cli-standard.exe" -Force
          Get-ChildItem -Path "whisper.cpp-src/build-standard/bin/Release/*.dll" | Copy-Item -Destination "whisper-bins/cuda/standard/" -Force
          if ($vcompDll) { Copy-Item $vcompDll.FullName "whisper-bins/cuda/standard/" -Force }

          # 2. Vulkan
          Copy-Item "whisper.cpp-src/build-vulkan/bin/Release/whisper-cli.exe" "whisper-bins/cuda/vulkan/whisper-cli-vulkan.exe" -Force
          Get-ChildItem -Path "whisper.cpp-src/build-vulkan/bin/Release/*.dll" | Copy-Item -Destination "whisper-bins/cuda/vulkan/" -Force
          if (Test-Path "whisper-bins/vulkan-1.dll") { Copy-Item "whisper-bins/vulkan-1.dll" "whisper-bins/cuda/vulkan/" -Force }
          if ($vcompDll) { Copy-Item $vcompDll.FullName "whisper-bins/cuda/vulkan/" -Force }

          # 3. CUDA
          Copy-Item "whisper.cpp-src/build-cuda/bin/Release/whisper-cli.exe" "whisper-bins/cuda/cuda/whisper-cli-cuda.exe" -Force
          Get-ChildItem -Path "whisper.cpp-src/build-cuda/bin/Release/*.dll" | Copy-Item -Destination "whisper-bins/cuda/cuda/" -Force
          Get-ChildItem -Path "cuda-dlls/*.dll" -ErrorAction SilentlyContinue | Copy-Item -Destination "whisper-bins/cuda/cuda/" -Force
          if ($vcompDll) { Copy-Item $vcompDll.FullName "whisper-bins/cuda/cuda/" -Force }

      - name: Compile Whisper CLI (macOS Universal Native + Metal)
        if: matrix.platform == 'macos-latest' && steps.whisper-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p whisper-bins

          # 1. x86_64 Intel Build (Metal disabled on Intel cross)
          echo "Building x86_64 Intel binary..."
          cmake -B whisper.cpp-src/build-x64 -S whisper.cpp-src -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="x86_64" -DGGML_METAL=OFF -DBUILD_SHARED_LIBS=OFF -DGGML_NATIVE=OFF -DGGML_AVX512=OFF -DGGML_AVX=ON -DGGML_AVX2=ON -DGGML_FMA=ON -DGGML_F16C=ON
          cmake --build whisper.cpp-src/build-x64 -j$(sysctl -n hw.ncpu) --config Release --target whisper-cli

          # 2. ARM64 Apple Silicon Build (Metal Accelerated for M1-M4)
          echo "Building ARM64 Apple Silicon binary with Metal..."
          cmake -B whisper.cpp-src/build-arm64 -S whisper.cpp-src -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64" -DGGML_METAL=ON -DBUILD_SHARED_LIBS=OFF -DGGML_NATIVE=OFF
          cmake --build whisper.cpp-src/build-arm64 -j$(sysctl -n hw.ncpu) --config Release --target whisper-cli

          # 3. Combine into Universal Mach-O Fat Binary
          echo "Creating Universal Mach-O binary..."
          lipo -create whisper.cpp-src/build-x64/bin/whisper-cli whisper.cpp-src/build-arm64/bin/whisper-cli -output whisper-bins/whisper-cli-standard

          cp whisper-bins/whisper-cli-standard whisper-bins/whisper-cli-vulkan
          cp whisper-bins/whisper-cli-standard whisper-bins/whisper-cli-openvino
          cp whisper-bins/whisper-cli-standard whisper-bins/whisper-cli-cuda

          chmod +x whisper-bins/whisper-cli-*
          codesign --force --sign - whisper-bins/whisper-cli-*

      # --- FFMPEG & FFPROBE BINARIES CACHING & DOWNLOAD ---

      - name: Cache FFmpeg Binaries
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: |
            ffmpeg-bins/**
          key: ffmpeg-${{ matrix.platform }}-${{ matrix.arch }}-v5

      - name: Download Hardware-Accelerated FFmpeg (Linux x86_64 - BtbN GPL)
        if: matrix.platform == 'ubuntu-22.04' && steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ffmpeg-bins
          wget -q -O ffmpeg-linux.tar.xz https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
          tar -xJf ffmpeg-linux.tar.xz --wildcards --strip-components=2 -C ffmpeg-bins/ "*/bin/ffmpeg" "*/bin/ffprobe"
          rm -f ffmpeg-linux.tar.xz
          chmod +x ffmpeg-bins/ffmpeg ffmpeg-bins/ffprobe

      - name: Download Hardware-Accelerated FFmpeg (Linux arm64 - BtbN GPL)
        if: matrix.platform == 'ubuntu-24.04-arm' && steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ffmpeg-bins
          wget -q -O ffmpeg-linux-arm.tar.xz https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linuxarm64-gpl.tar.xz
          tar -xJf ffmpeg-linux-arm.tar.xz --wildcards --strip-components=2 -C ffmpeg-bins/ "*/bin/ffmpeg" "*/bin/ffprobe"
          rm -f ffmpeg-linux-arm.tar.xz
          chmod +x ffmpeg-bins/ffmpeg ffmpeg-bins/ffprobe

      - name: Download Static FFmpeg (Windows x64 - Full Build)
        if: matrix.platform == 'windows-2022' && steps.ffmpeg-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ffmpeg-bins
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-full.7z" -OutFile "ffmpeg.7z"
          7z x ffmpeg.7z -offmpeg-extracted -y
          $binFolder = Get-ChildItem -Path "ffmpeg-extracted" -Recurse -Directory -Filter "bin" | Select-Object -First 1
          Copy-Item -Path "$($binFolder.FullName)\ffmpeg.exe" -Destination "ffmpeg-bins/ffmpeg.exe"
          Copy-Item -Path "$($binFolder.FullName)\ffprobe.exe" -Destination "ffmpeg-bins/ffprobe.exe"
          Remove-Item -Recurse -Force "ffmpeg.7z", "ffmpeg-extracted"

      - name: Download Static FFmpeg & FFprobe (macOS Universal Native)
        if: matrix.platform == 'macos-latest' && steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ffmpeg-bins
          # 1. FFmpeg Universal Mach-O binary (ARM64 + x86_64 from Martin Riedl)
          curl -fL -o ffmpeg-arm64.zip "https://ffmpeg.martin-riedl.de/redirect/latest/macos/arm64/release/ffmpeg.zip"
          unzip -q -o ffmpeg-arm64.zip -d ./ffmpeg-arm64-dir
          curl -fL -o ffmpeg-x64.zip "https://ffmpeg.martin-riedl.de/redirect/latest/macos/amd64/release/ffmpeg.zip"
          unzip -q -o ffmpeg-x64.zip -d ./ffmpeg-x64-dir
          lipo -create ./ffmpeg-arm64-dir/ffmpeg ./ffmpeg-x64-dir/ffmpeg -output ffmpeg-bins/ffmpeg
          rm -rf ffmpeg-arm64.zip ffmpeg-x64.zip ./ffmpeg-arm64-dir ./ffmpeg-x64-dir

          # 2. FFprobe Universal Mach-O binary (ARM64 + x86_64 from Martin Riedl)
          curl -fL -o ffprobe-arm64.zip "https://ffmpeg.martin-riedl.de/redirect/latest/macos/arm64/release/ffprobe.zip"
          unzip -q -o ffprobe-arm64.zip -d ./ffprobe-arm64-dir
          curl -fL -o ffprobe-x64.zip "https://ffmpeg.martin-riedl.de/redirect/latest/macos/amd64/release/ffprobe.zip"
          unzip -q -o ffprobe-x64.zip -d ./ffprobe-x64-dir
          lipo -create ./ffprobe-arm64-dir/ffprobe ./ffprobe-x64-dir/ffprobe -output ffmpeg-bins/ffprobe
          rm -rf ffprobe-arm64.zip ffprobe-x64.zip ./ffprobe-arm64-dir ./ffprobe-x64-dir

          # 3. Fix permissions and ad-hoc code sign for Apple Silicon Gatekeeper
          chmod +x ffmpeg-bins/ffmpeg ffmpeg-bins/ffprobe
          codesign --force --sign - ffmpeg-bins/ffmpeg
          codesign --force --sign - ffmpeg-bins/ffprobe

      # --- TAURI APPLICATION BUNDLING & RELEASE ---

      - name: Extract App Version
        id: app_version
        shell: bash
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      # --- BUILD TAURI (LINUX X86_64: UNIVERSAL + NVIDIA CUDA EDITIONS) ---
      - name: Build Tauri Application (Linux x86_64)
        if: matrix.platform == 'ubuntu-22.04'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NO_STRIP: true
        run: |
          # 0. Prepare appimagetool
          wget -q -O appimagetool https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          ./appimagetool --appimage-extract
          mv squashfs-root appimagetool-temp

          fix_appimage_graphics() {
            local target_img="$1"
            if [ -f "$target_img" ]; then
              echo "Patching graphics and audio media libs in AppImage: $target_img"
              chmod +x "$target_img"
              "$target_img" --appimage-extract

              # 1. Strip host-interfering GPU and display libraries so host Mesa/Wayland/DRI drivers work natively
              rm -f squashfs-root/usr/lib/libEGL.so* squashfs-root/usr/lib/libGL.so* squashfs-root/usr/lib/libgbm.so* squashfs-root/usr/lib/libglapi.so* squashfs-root/usr/lib/libwayland-client.so* squashfs-root/usr/lib/libdrm.so* squashfs-root/usr/lib/libvulkan.so* squashfs-root/usr/lib/libva*.so*
              rm -f squashfs-root/usr/lib/x86_64-linux-gnu/libEGL.so* squashfs-root/usr/lib/x86_64-linux-gnu/libGL.so* squashfs-root/usr/lib/x86_64-linux-gnu/libgbm.so* squashfs-root/usr/lib/x86_64-linux-gnu/libglapi.so* squashfs-root/usr/lib/x86_64-linux-gnu/libwayland-client.so* squashfs-root/usr/lib/x86_64-linux-gnu/libdrm.so* squashfs-root/usr/lib/x86_64-linux-gnu/libvulkan.so* squashfs-root/usr/lib/x86_64-linux-gnu/libva*.so*

              # 2. Strip obsolete Ubuntu 22.04 PipeWire/JACK libraries that break on modern Linux audio hosts (undefined symbol: pw_context_get_data_loop)
              rm -f squashfs-root/usr/lib/libpipewire-*.so* squashfs-root/usr/lib/libjack*.so*
              rm -f squashfs-root/usr/lib/x86_64-linux-gnu/libpipewire-*.so* squashfs-root/usr/lib/x86_64-linux-gnu/libjack*.so*
              rm -f squashfs-root/usr/lib/gstreamer-1.0/libgstpipewire.so squashfs-root/usr/lib/gstreamer-1.0/libgstjack.so squashfs-root/usr/lib/gstreamer-1.0/libgstva.so

              # 3. Allow Wayland-native execution on Wayland sessions while preserving x11 fallback
              if [ -f squashfs-root/apprun-hooks/linuxdeploy-plugin-gtk.sh ]; then
                sed -i 's/export GDK_BACKEND=x11/export GDK_BACKEND="${GDK_BACKEND:-wayland,x11}"/' squashfs-root/apprun-hooks/linuxdeploy-plugin-gtk.sh
              fi

              # 4. Enforce POSIX standard execution and read permissions across all files and entrypoints
              # Guarantees compatibility with unprivileged sandbox environments (Firejail, bubblewrap)
              chmod -R a+rX squashfs-root
              chmod a+x squashfs-root/AppRun squashfs-root/AppRun.wrapped 2>/dev/null || true
              find squashfs-root/usr/bin -type f -exec chmod a+x {} + 2>/dev/null || true
              find squashfs-root/apprun-hooks -type f -exec chmod a+rx {} + 2>/dev/null || true

              rm -f "$target_img"
              export ARCH=x86_64
              ./appimagetool-temp/AppRun squashfs-root "$target_img"
              rm -rf squashfs-root
            fi
          }

          recompress_deb_zstd() {
            local target_deb="$1"
            if [ -f "$target_deb" ]; then
              echo "Recompressing DEB with zstd level 3: $target_deb"
              local tmp_dir
              tmp_dir=$(mktemp -d -t deb-repack-XXXXXX)
              dpkg-deb -R "$target_deb" "$tmp_dir"
              rm -f "$tmp_dir/repacked.deb"
              dpkg-deb --root-owner-group -Zzstd -z3 -b "$tmp_dir" "$tmp_dir.deb"
              mv -f "$tmp_dir.deb" "$target_deb"
              rm -rf "$tmp_dir" "$tmp_dir.deb"
            fi
          }

          build_rpm_from_deb() {
            local deb_path="$1"
            local output_rpm="$2"
            echo "Building native RPM via rpmbuild from: $deb_path"
            local tmp_root
            tmp_root=$(mktemp -d -t rpm-build-XXXXXX)
            local buildroot="$tmp_root/BUILDROOT"
            local rpmdir="$tmp_root/RPMS"
            mkdir -p "$buildroot" "$rpmdir"

            dpkg-deb -x "$deb_path" "$buildroot"
            rm -f "$buildroot/repacked.deb"

            printf '%s\n' \
              '%define _binary_payload w3.zstdio' \
              '%define _build_id_links none' \
              '%define __strip /bin/true' \
              '%define _source_payload w3.zstdio' \
              '%define _unpackaged_files_terminate_build 0' \
              '' \
              'Name: whisper-desktop' \
              'Version: @@VERSION@@' \
              'Release: 1' \
              'Summary: High-performance native desktop studio for local speech-to-text, subtitle translation, and video hardsubbing' \
              'License: GPL-3.0-or-later' \
              'URL: https://github.com/AtomicError/whisper-desktop' \
              'AutoReqProv: no' \
              'Requires: libappindicator3.so.1()(64bit), libwebkit2gtk-4.1.so.0()(64bit), libgtk-3.so.0()(64bit)' \
              'Provides: whisper-desktop = @@VERSION@@, whisper-desktop(x86_64) = @@VERSION@@' \
              '' \
              '%description' \
              'High-performance native desktop studio for local speech-to-text, subtitle translation, and video hardsubbing' \
              '' \
              '%files' \
              '/usr/bin/whisper-desktop' \
              '"/usr/lib/Whisper Desktop"' \
              '"/usr/share/applications/Whisper Desktop.desktop"' \
              '/usr/share/icons/hicolor/*/apps/*' \
              > "$tmp_root/pkg.spec"

            sed -i "s/@@VERSION@@/${{ steps.app_version.outputs.version }}/g" "$tmp_root/pkg.spec"

            rpmbuild -bb \
              --buildroot "$buildroot" \
              --define "_rpmdir $rpmdir" \
              --define "_topdir $tmp_root" \
              "$tmp_root/pkg.spec"

            local generated_rpm
            generated_rpm=$(find "$rpmdir" -type f -name "*.rpm" | head -n 1)
            if [ -f "$generated_rpm" ]; then
              mkdir -p "$(dirname "$output_rpm")"
              mv -f "$generated_rpm" "$output_rpm"
              echo "Successfully generated native RPM: $output_rpm"
            else
              echo "ERROR: Failed to generate RPM from $deb_path"
              exit 1
            fi
            rm -rf "$tmp_root"
          }

          # 1. Build Universal Edition (Standard CPU + Vulkan + OpenVINO)
          echo "=== 1/2: Building Linux Universal Edition (CPU + Vulkan + OpenVINO) ==="
          rm -rf src-tauri/resources/*
          mkdir -p src-tauri/resources/fonts src-tauri/resources/standard src-tauri/resources/vulkan src-tauri/resources/openvino src-tauri/resources/cuda
          touch src-tauri/resources/standard/.keep src-tauri/resources/vulkan/.keep src-tauri/resources/openvino/.keep src-tauri/resources/cuda/.keep
          cp -dr whisper-bins/universal/* src-tauri/resources/
          cp ffmpeg-bins/ffmpeg src-tauri/resources/
          cp ffmpeg-bins/ffprobe src-tauri/resources/
          cp src/fonts/* src-tauri/resources/fonts/ || true
          find src-tauri/resources -xtype l -delete 2>/dev/null || true
          chmod -R 755 src-tauri/resources/ 2>/dev/null || true

          npm run tauri build -- -b deb,appimage --verbose

          UNIVERSAL_APPIMAGE=$(find src-tauri/target/release/bundle/appimage/ -name "*.AppImage" | head -n 1)
          fix_appimage_graphics "$UNIVERSAL_APPIMAGE"

          UNIVERSAL_DEB=$(find src-tauri/target/release/bundle/deb/ -name "*.deb" | head -n 1)
          if [ -f "$UNIVERSAL_DEB" ]; then
            build_rpm_from_deb "$UNIVERSAL_DEB" "src-tauri/target/release/bundle/rpm/Whisper Desktop-${{ steps.app_version.outputs.version }}-1.x86_64.rpm"
            recompress_deb_zstd "$UNIVERSAL_DEB"
          fi

          mkdir -p staging-universal/appimage staging-universal/deb staging-universal/rpm
          cp -r src-tauri/target/release/bundle/appimage/* staging-universal/appimage/ || true
          cp -r src-tauri/target/release/bundle/deb/* staging-universal/deb/ || true
          cp -r src-tauri/target/release/bundle/rpm/* staging-universal/rpm/ || true

          # 2. Build NVIDIA CUDA Edition (Standard CPU + Vulkan + CUDA)
          echo "=== 2/2: Building Linux NVIDIA CUDA Edition (CPU + Vulkan + CUDA) ==="
          rm -rf src-tauri/resources/*
          mkdir -p src-tauri/resources/fonts src-tauri/resources/standard src-tauri/resources/vulkan src-tauri/resources/openvino src-tauri/resources/cuda
          touch src-tauri/resources/standard/.keep src-tauri/resources/vulkan/.keep src-tauri/resources/openvino/.keep src-tauri/resources/cuda/.keep
          cp -dr whisper-bins/cuda/* src-tauri/resources/
          cp ffmpeg-bins/ffmpeg src-tauri/resources/
          cp ffmpeg-bins/ffprobe src-tauri/resources/
          cp src/fonts/* src-tauri/resources/fonts/ || true
          find src-tauri/resources -xtype l -delete 2>/dev/null || true
          chmod -R 755 src-tauri/resources/ 2>/dev/null || true

          # Clean previous build artifacts before second pass
          rm -rf src-tauri/target/release/bundle/appimage/* src-tauri/target/release/bundle/deb/* src-tauri/target/release/bundle/rpm/*

          npm run tauri build -- -b deb,appimage --verbose

          CUDA_APPIMAGE=$(find src-tauri/target/release/bundle/appimage/ -name "*.AppImage" | head -n 1)
          fix_appimage_graphics "$CUDA_APPIMAGE"

          CUDA_DEB=$(find src-tauri/target/release/bundle/deb/ -name "*.deb" | head -n 1)
          if [ -f "$CUDA_DEB" ]; then
            build_rpm_from_deb "$CUDA_DEB" "src-tauri/target/release/bundle/rpm/Whisper Desktop-${{ steps.app_version.outputs.version }}-1.x86_64-cuda.rpm"
            recompress_deb_zstd "$CUDA_DEB"
          fi

          # Rename CUDA bundles with -cuda suffix
          for f in src-tauri/target/release/bundle/appimage/*.AppImage; do
            if [ -f "$f" ] && [[ "$f" != *"-cuda.AppImage" ]]; then
              mv "$f" "${f%.AppImage}-cuda.AppImage"
            fi
          done
          for f in src-tauri/target/release/bundle/deb/*.deb; do
            if [ -f "$f" ] && [[ "$f" != *"-cuda.deb" ]]; then
              mv "$f" "${f%.deb}-cuda.deb"
            fi
          done
          for f in src-tauri/target/release/bundle/rpm/*.rpm; do
            if [ -f "$f" ] && [[ "$f" != *"-cuda.rpm" ]]; then
              mv "$f" "${f%.rpm}-cuda.rpm"
            fi
          done

          # Merge Universal bundles back into release bundle directory
          cp -r staging-universal/appimage/* src-tauri/target/release/bundle/appimage/
          cp -r staging-universal/deb/* src-tauri/target/release/bundle/deb/
          cp -r staging-universal/rpm/* src-tauri/target/release/bundle/rpm/
          # Normalize any space in bundle filenames to prevent issues in terminal and release links
          find src-tauri/target/release/bundle -type f -name "*Whisper Desktop*" | while read -r f; do
            dir="$(dirname "$f")"
            base="$(basename "$f")"
            mv "$f" "$dir/${base//Whisper Desktop/WhisperDesktop}"
          done || true

          rm -rf staging-universal appimagetool-temp appimagetool

      # --- BUILD TAURI (WINDOWS X64: UNIVERSAL + NVIDIA CUDA EDITIONS) ---
      - name: Build Tauri Application (Windows x64)
        if: matrix.platform == 'windows-2022'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NO_STRIP: true
        run: |
          # Pre-download official Microsoft Visual C++ 2015-2022 Redistributable installer
          Write-Host "Fetching Microsoft Visual C++ 2015-2022 Redistributable (x64)..."
          Invoke-WebRequest -Uri "https://aka.ms/vs/17/release/vc_redist.x64.exe" -OutFile "vc_redist.x64.exe"

          # 1. Build Universal Edition (Standard CPU + Vulkan + OpenVINO)
          Write-Host "=== 1/2: Building Windows Universal Edition (CPU + Vulkan + OpenVINO) ==="
          Remove-Item -Path "src-tauri/resources/*" -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path src-tauri/resources/fonts
          New-Item -ItemType Directory -Force -Path src-tauri/resources/standard
          New-Item -ItemType Directory -Force -Path src-tauri/resources/vulkan
          New-Item -ItemType Directory -Force -Path src-tauri/resources/openvino
          New-Item -ItemType Directory -Force -Path src-tauri/resources/cuda
          New-Item -ItemType File -Force -Path src-tauri/resources/standard/.keep
          New-Item -ItemType File -Force -Path src-tauri/resources/vulkan/.keep
          New-Item -ItemType File -Force -Path src-tauri/resources/openvino/.keep
          New-Item -ItemType File -Force -Path src-tauri/resources/cuda/.keep
          Copy-Item "whisper-bins/universal/*" "src-tauri/resources/" -Recurse -Force
          Copy-Item "ffmpeg-bins/ffmpeg.exe" "src-tauri/resources/"
          Copy-Item "ffmpeg-bins/ffprobe.exe" "src-tauri/resources/"
          Copy-Item "vc_redist.x64.exe" "src-tauri/resources/" -Force
          Copy-Item "src/fonts/*" "src-tauri/resources/fonts/" -ErrorAction SilentlyContinue

          npm run tauri build -- --config src-tauri/tauri.windows.conf.json

          New-Item -ItemType Directory -Force -Path staging-universal/nsis
          New-Item -ItemType Directory -Force -Path staging-universal/msi
          New-Item -ItemType Directory -Force -Path staging-universal/zip
          Copy-Item "src-tauri/target/release/bundle/nsis/*" "staging-universal/nsis/" -Force
          Copy-Item "src-tauri/target/release/bundle/msi/*" "staging-universal/msi/" -Force

          # Create Universal Portable ZIP Archive
          Write-Host "Packaging Windows Universal Portable Archive..."
          $universalPortableDir = "WhisperDesktop_${{ steps.app_version.outputs.version }}_x64-portable"
          New-Item -ItemType Directory -Force -Path $universalPortableDir
          $mainExe = Get-ChildItem -Path "src-tauri/target/release/*.exe" | Where-Object { $_.Name -match "^(whisper[-_ ]desktop|Whisper\s?Desktop)\.exe$" } | Select-Object -First 1
          if ($mainExe) {
            Copy-Item $mainExe.FullName "$universalPortableDir/whisper-desktop.exe" -Force
          } else {
            Copy-Item "src-tauri/target/release/whisper-desktop.exe" "$universalPortableDir/whisper-desktop.exe" -Force -ErrorAction SilentlyContinue
          }
          Copy-Item "src-tauri/resources" "$universalPortableDir/resources" -Recurse -Force
          New-Item -ItemType Directory -Force -Path src-tauri/target/release/bundle/zip
          7z a -tzip "src-tauri/target/release/bundle/zip/WhisperDesktop_${{ steps.app_version.outputs.version }}_x64-portable.zip" "./$universalPortableDir/*"
          Copy-Item "src-tauri/target/release/bundle/zip/WhisperDesktop_${{ steps.app_version.outputs.version }}_x64-portable.zip" "staging-universal/zip/" -Force
          Remove-Item -Path $universalPortableDir -Recurse -Force

          # 2. Build NVIDIA CUDA Edition (Standard CPU + Vulkan + CUDA)
          Write-Host "=== 2/2: Building Windows NVIDIA CUDA Edition (CPU + Vulkan + CUDA) ==="
          Remove-Item -Path "src-tauri/resources/*" -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path src-tauri/resources/fonts
          New-Item -ItemType Directory -Force -Path src-tauri/resources/standard
          New-Item -ItemType Directory -Force -Path src-tauri/resources/vulkan
          New-Item -ItemType Directory -Force -Path src-tauri/resources/openvino
          New-Item -ItemType Directory -Force -Path src-tauri/resources/cuda
          New-Item -ItemType File -Force -Path src-tauri/resources/standard/.keep
          New-Item -ItemType File -Force -Path src-tauri/resources/vulkan/.keep
          New-Item -ItemType File -Force -Path src-tauri/resources/openvino/.keep
          New-Item -ItemType File -Force -Path src-tauri/resources/cuda/.keep
          Copy-Item "whisper-bins/cuda/*" "src-tauri/resources/" -Recurse -Force
          Copy-Item "ffmpeg-bins/ffmpeg.exe" "src-tauri/resources/"
          Copy-Item "ffmpeg-bins/ffprobe.exe" "src-tauri/resources/"
          Copy-Item "vc_redist.x64.exe" "src-tauri/resources/" -Force
          Copy-Item "src/fonts/*" "src-tauri/resources/fonts/" -ErrorAction SilentlyContinue

          Remove-Item -Path "src-tauri/target/release/bundle/nsis/*" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -Path "src-tauri/target/release/bundle/msi/*" -Recurse -Force -ErrorAction SilentlyContinue

          npm run tauri build -- --config src-tauri/tauri.windows.conf.json

          # Rename CUDA bundles with -cuda suffix
          Get-ChildItem -Path "src-tauri/target/release/bundle/nsis/*.exe" | ForEach-Object {
            $newName = $_.Name -replace "-setup\.exe$", "-cuda-setup.exe"
            if ($newName -eq $_.Name) { $newName = $_.Name -replace "\.exe$", "-cuda.exe" }
            Rename-Item -Path $_.FullName -NewName $newName
          }
          Get-ChildItem -Path "src-tauri/target/release/bundle/msi/*.msi" | ForEach-Object {
            $newName = $_.Name -replace "_en-US\.msi$", "_cuda_en-US.msi"
            if ($newName -eq $_.Name) { $newName = $_.Name -replace "\.msi$", "-cuda.msi" }
            Rename-Item -Path $_.FullName -NewName $newName
          }

          # Create NVIDIA CUDA Portable ZIP Archive
          Write-Host "Packaging Windows NVIDIA CUDA Portable Archive..."
          $cudaPortableDir = "WhisperDesktop_${{ steps.app_version.outputs.version }}_x64-cuda-portable"
          New-Item -ItemType Directory -Force -Path $cudaPortableDir
          $cudaMainExe = Get-ChildItem -Path "src-tauri/target/release/*.exe" | Where-Object { $_.Name -match "^(whisper[-_ ]desktop|Whisper\s?Desktop)\.exe$" } | Select-Object -First 1
          if ($cudaMainExe) {
            Copy-Item $cudaMainExe.FullName "$cudaPortableDir/whisper-desktop.exe" -Force
          } else {
            Copy-Item "src-tauri/target/release/whisper-desktop.exe" "$cudaPortableDir/whisper-desktop.exe" -Force -ErrorAction SilentlyContinue
          }
          Copy-Item "src-tauri/resources" "$cudaPortableDir/resources" -Recurse -Force
          7z a -tzip "src-tauri/target/release/bundle/zip/WhisperDesktop_${{ steps.app_version.outputs.version }}_x64-cuda-portable.zip" "./$cudaPortableDir/*"
          Remove-Item -Path $cudaPortableDir -Recurse -Force

          # Merge Universal bundles back into release bundle directory
          Copy-Item "staging-universal/nsis/*" "src-tauri/target/release/bundle/nsis/" -Force
          Copy-Item "staging-universal/msi/*" "src-tauri/target/release/bundle/msi/" -Force
          Copy-Item "staging-universal/zip/*" "src-tauri/target/release/bundle/zip/" -Force
          Remove-Item -Path "staging-universal" -Recurse -Force

          # Normalize any space in bundle filenames to prevent broken links
          Get-ChildItem -Path "src-tauri/target/release/bundle" -Recurse -File | Where-Object { $_.Name -like "*Whisper Desktop*" } | ForEach-Object {
            $cleanName = $_.Name -replace "Whisper Desktop", "WhisperDesktop"
            Rename-Item -Path $_.FullName -NewName $cleanName -Force
          }

      # --- BUILD TAURI (LINUX ARM64 & MACOS) ---
      - name: Build Tauri Application (macOS / Linux ARM64)
        if: matrix.platform == 'macos-latest' || matrix.platform == 'ubuntu-24.04-arm'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NO_STRIP: true
        run: |
          mkdir -p src-tauri/resources/fonts src-tauri/resources/standard src-tauri/resources/vulkan src-tauri/resources/openvino src-tauri/resources/cuda
          touch src-tauri/resources/standard/.keep src-tauri/resources/vulkan/.keep src-tauri/resources/openvino/.keep src-tauri/resources/cuda/.keep

          # Populate backend-isolated subdirectories
          [ -f whisper-bins/whisper-cli-standard ] && cp -f whisper-bins/whisper-cli-standard src-tauri/resources/standard/whisper-cli-standard
          [ -f whisper-bins/whisper-cli-vulkan ] && cp -f whisper-bins/whisper-cli-vulkan src-tauri/resources/vulkan/whisper-cli-vulkan
          [ -f whisper-bins/whisper-cli-openvino ] && cp -f whisper-bins/whisper-cli-openvino src-tauri/resources/openvino/whisper-cli-openvino
          [ -f whisper-bins/whisper-cli-cuda ] && cp -f whisper-bins/whisper-cli-cuda src-tauri/resources/cuda/whisper-cli-cuda
          cp -f whisper-bins/*.so* src-tauri/resources/standard/ 2>/dev/null || true

          # Also keep top-level copy for compatibility
          if [ "$(uname)" = "Darwin" ]; then
            cp -R whisper-bins/whisper-cli-* src-tauri/resources/ 2>/dev/null || true
          else
            cp -d whisper-bins/whisper-cli-* src-tauri/resources/ 2>/dev/null || true
            cp -d whisper-bins/*.so* src-tauri/resources/ 2>/dev/null || true
          fi
          cp ffmpeg-bins/ffmpeg src-tauri/resources/
          cp ffmpeg-bins/ffprobe src-tauri/resources/
          cp src/fonts/* src-tauri/resources/fonts/ || true
          chmod -R 755 src-tauri/resources/ 2>/dev/null || true
          npm run tauri build -- ${{ matrix.args }}

          if [ "$(uname)" = "Linux" ]; then
            recompress_deb_zstd() {
              local target_deb="$1"
              if [ -f "$target_deb" ]; then
                echo "Recompressing DEB with zstd level 3: $target_deb"
                local tmp_dir
                tmp_dir=$(mktemp -d -t deb-repack-XXXXXX)
                dpkg-deb -R "$target_deb" "$tmp_dir"
                rm -f "$tmp_dir/repacked.deb"
                dpkg-deb --root-owner-group -Zzstd -z3 -b "$tmp_dir" "$tmp_dir.deb"
                mv -f "$tmp_dir.deb" "$target_deb"
                rm -rf "$tmp_dir" "$tmp_dir.deb"
              fi
            }

            find src-tauri/target/release/bundle/deb/ -name "*.deb" 2>/dev/null | while IFS= read -r deb_pkg; do
              recompress_deb_zstd "$deb_pkg"
            done
          fi

          # Normalize any space in bundle filenames
          find src-tauri/target/ -type f -name "*Whisper Desktop*" | while read -r f; do
            dir="$(dirname "$f")"
            base="$(basename "$f")"
            mv "$f" "$dir/${base//Whisper Desktop/WhisperDesktop}"
          done || true

