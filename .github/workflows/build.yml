            ### 💡 Edition Guide & Hardware Acceleration
            * 🔷 **Universal Edition:** Includes Standard CPU + Vulkan GPU + Intel OpenVINO acceleration. Recommended for AMD Radeon, Intel Arc / Iris Xe / UHD graphics, and systems without dedicated NVIDIA GPUs.
