name: Release & Build Cross-Platform

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-tauri:
    name: build-tauri (${{ matrix.platform }}, ${{ matrix.arch }})
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'ubuntu-22.04'
            arch: 'x86_64'
            args: ''
            rust-target: ''
          - platform: 'ubuntu-24.04-arm'
            arch: 'arm64'
            args: ''
            rust-target: ''
          - platform: 'windows-latest'
            arch: 'x86_64'
            args: ''
            rust-target: ''
          - platform: 'macos-latest'
            arch: 'universal'
            args: '--target universal-apple-darwin'
            rust-target: 'x86_64-apple-darwin,aarch64-apple-darwin'

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux dependencies (Ubuntu x86_64)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          wget -qO- https://packages.lunarg.com/lunarg-signing-key-pub.asc | sudo tee /etc/apt/trusted.gpg.d/lunarg.asc
          sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan-jammy.list http://packages.lunarg.com/vulkan/lunarg-vulkan-jammy.list
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            rpm \
            libglib2.0-dev \
            pkg-config \
            xdg-utils \
            file \
            build-essential \
            cmake \
            vulkan-sdk

      - name: Install Vulkan SDK (Windows)
        if: matrix.platform == 'windows-latest'
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          vulkan_version: latest
          cache: true

      - name: Install CUDA Toolkit (Windows)
        if: matrix.platform == 'windows-latest'
        uses: Jimver/cuda-toolkit@v0.2.35
        id: cuda-toolkit-windows
        with:
          cuda: '12.4.1'
          method: 'network'
          sub-packages: '["nvcc", "cudart", "cublas", "cublas_dev"]'

      - name: Install CUDA Toolkit (Ubuntu x86_64)
        if: matrix.platform == 'ubuntu-22.04'
        uses: Jimver/cuda-toolkit@v0.2.35
        id: cuda-toolkit
        with:
          cuda: '12.5.0'
          method: 'network'

      - name: Add Intel APT Repository for OpenVINO (Ubuntu x86_64)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          wget -q https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB
          sudo gpg --dearmor -o /usr/share/keyrings/intel-openvino.gpg GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB
          echo "deb [signed-by=/usr/share/keyrings/intel-openvino.gpg] https://apt.repos.intel.com/openvino ubuntu22 main" | sudo tee /etc/apt/sources.list.d/intel-openvino.list
          sudo apt-get update
          sudo apt-get install -y libopenvino-dev-2024.2.0

      - name: Install Linux dependencies (Ubuntu ARM64)
        if: matrix.platform == 'ubuntu-24.04-arm'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            rpm \
            libglib2.0-dev \
            pkg-config \
            xdg-utils \
            file \
            build-essential \
            cmake \
            libvulkan-dev \
            glslc \
            glslang-tools \
            spirv-headers

      - name: Install frontend dependencies
        run: npm ci

      # --- WHISPER.CPP BINARIES COMPILATION & CACHING ---

      - name: Detect Latest whisper.cpp Tag
        id: whisper_tag
        shell: bash
        run: |
          LATEST_TAG=$(git ls-remote --tags --refs https://github.com/ggml-org/whisper.cpp.git | awk -F/ '{print $3}' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)
          if [ -z "$LATEST_TAG" ]; then
            LATEST_TAG="v1.7.4"
          fi
          echo "tag=$LATEST_TAG" >> $GITHUB_OUTPUT
          echo "Detected whisper.cpp tag: $LATEST_TAG"

      - name: Cache Whisper Binaries
        id: whisper-cache
        uses: actions/cache@v4
        with:
          path: |
            src-tauri/resources/whisper-cli-*
            src-tauri/resources/*.dll
          key: whisper-bin-${{ matrix.platform }}-${{ matrix.arch }}-${{ steps.whisper_tag.outputs.tag }}-v2

      - name: Clone whisper.cpp
        if: steps.whisper-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p src-tauri/resources
          git clone --depth 1 --branch "${{ steps.whisper_tag.outputs.tag }}" https://github.com/ggml-org/whisper.cpp.git whisper.cpp-src

      - name: Compile Whisper CLI (Linux x86_64)
        if: matrix.platform == 'ubuntu-22.04' && steps.whisper-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p src-tauri/resources

          # 1. Standard CPU Backend
          echo "Building Standard CPU backend..."
          cmake -B whisper.cpp-src/build-standard -S whisper.cpp-src -DCMAKE_BUILD_TYPE=Release -DGGML_OPENMP=ON -DBUILD_SHARED_LIBS=OFF
          cmake --build whisper.cpp-src/build-standard -j$(nproc) --config Release --target whisper-cli
          cp whisper.cpp-src/build-standard/bin/whisper-cli src-tauri/resources/whisper-cli-standard

          # 2. Vulkan Backend
          echo "Building Vulkan backend..."
          cmake -B whisper.cpp-src/build-vulkan -S whisper.cpp-src -DCMAKE_BUILD_TYPE=Release -DGGML_OPENMP=ON -DGGML_VULKAN=ON -DBUILD_SHARED_LIBS=OFF
          cmake --build whisper.cpp-src/build-vulkan -j$(nproc) --config Release --target whisper-cli
          cp whisper.cpp-src/build-vulkan/bin/whisper-cli src-tauri/resources/whisper-cli-vulkan

          # 3. OpenVINO Backend
          echo "Building OpenVINO backend..."
          cmake -B whisper.cpp-src/build-openvino -S whisper.cpp-src -DCMAKE_BUILD_TYPE=Release -DGGML_OPENMP=ON -DWHISPER_OPENVINO=1 -DBUILD_SHARED_LIBS=OFF
          cmake --build whisper.cpp-src/build-openvino -j$(nproc) --config Release --target whisper-cli
          cp whisper.cpp-src/build-openvino/bin/whisper-cli src-tauri/resources/whisper-cli-openvino

          # 4. CUDA Backend
          echo "Building CUDA backend..."
          cmake -B whisper.cpp-src/build-cuda -S whisper.cpp-src -DCMAKE_BUILD_TYPE=Release -DGGML_OPENMP=ON -DGGML_CUDA=ON -DBUILD_SHARED_LIBS=OFF
          cmake --build whisper.cpp-src/build-cuda -j$(nproc) --config Release --target whisper-cli
          cp whisper.cpp-src/build-cuda/bin/whisper-cli src-tauri/resources/whisper-cli-cuda

          chmod +x src-tauri/resources/whisper-cli-*

      - name: Compile Whisper CLI (Linux ARM64)
        if: matrix.platform == 'ubuntu-24.04-arm' && steps.whisper-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p src-tauri/resources

          # 1. Standard CPU Backend (NEON Accelerated)
          echo "Building Standard ARM64 CPU backend..."
          cmake -B whisper.cpp-src/build-standard -S whisper.cpp-src -DCMAKE_BUILD_TYPE=Release -DGGML_OPENMP=ON -DBUILD_SHARED_LIBS=OFF
          cmake --build whisper.cpp-src/build-standard -j$(nproc) --config Release --target whisper-cli
          cp whisper.cpp-src/build-standard/bin/whisper-cli src-tauri/resources/whisper-cli-standard

          # 2. Vulkan Backend
          echo "Building Vulkan ARM64 backend..."
          cmake -B whisper.cpp-src/build-vulkan -S whisper.cpp-src -DCMAKE_BUILD_TYPE=Release -DGGML_OPENMP=ON -DGGML_VULKAN=ON -DBUILD_SHARED_LIBS=OFF
          cmake --build whisper.cpp-src/build-vulkan -j$(nproc) --config Release --target whisper-cli
          cp whisper.cpp-src/build-vulkan/bin/whisper-cli src-tauri/resources/whisper-cli-vulkan

          # Fallbacks for OpenVINO/CUDA
          cp src-tauri/resources/whisper-cli-standard src-tauri/resources/whisper-cli-openvino
          cp src-tauri/resources/whisper-cli-standard src-tauri/resources/whisper-cli-cuda

          chmod +x src-tauri/resources/whisper-cli-*

      - name: Compile Whisper CLI (Windows x64)
        if: matrix.platform == 'windows-latest' && steps.whisper-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri/resources

          # 1. Standard CPU Backend (MSVC + AVX2 / OpenMP)
          Write-Host "Building Standard CPU backend for Windows..."
          cmake -B whisper.cpp-src/build-standard -S whisper.cpp-src -DCMAKE_BUILD_TYPE=Release -DGGML_OPENMP=ON -DBUILD_SHARED_LIBS=OFF
          cmake --build whisper.cpp-src/build-standard --config Release --target whisper-cli
          Copy-Item whisper.cpp-src/build-standard/bin/Release/whisper-cli.exe src-tauri/resources/whisper-cli-standard.exe

          # 2. Vulkan Backend (MSVC + Vulkan SDK)
          Write-Host "Building Vulkan backend for Windows..."
          cmake -B whisper.cpp-src/build-vulkan -S whisper.cpp-src -DCMAKE_BUILD_TYPE=Release -DGGML_VULKAN=ON -DBUILD_SHARED_LIBS=OFF
          cmake --build whisper.cpp-src/build-vulkan --config Release --target whisper-cli
          Copy-Item whisper.cpp-src/build-vulkan/bin/Release/whisper-cli.exe src-tauri/resources/whisper-cli-vulkan.exe

          # 3. OpenVINO Backend (Intel CPU / iGPU Acceleration)
          Write-Host "Setting up OpenVINO 2024 for Windows..."
          $openvinoUrl = "https://storage.openvinotoolkit.org/repositories/openvino/packages/2024.2/windows/w_openvino_toolkit_windows_2024.2.0.15519.5c0f38f83f6_x86_64.zip"
          Invoke-WebRequest -Uri $openvinoUrl -OutFile "openvino.zip"
          7z x openvino.zip -oopenvino-extracted -y
          $openvinoDir = Get-ChildItem -Path "openvino-extracted" -Directory | Select-Object -First 1

          Write-Host "Building OpenVINO backend for Windows..."
          cmake -B whisper.cpp-src/build-openvino -S whisper.cpp-src -DCMAKE_BUILD_TYPE=Release -DGGML_OPENMP=ON -DWHISPER_OPENVINO=1 -DOpenVINO_DIR="$($openvinoDir.FullName)/runtime/cmake" -DBUILD_SHARED_LIBS=OFF
          cmake --build whisper.cpp-src/build-openvino --config Release --target whisper-cli
          Copy-Item whisper.cpp-src/build-openvino/bin/Release/whisper-cli.exe src-tauri/resources/whisper-cli-openvino.exe

          # Copy OpenVINO & TBB runtime DLLs to resources
          Get-ChildItem -Path "$($openvinoDir.FullName)/runtime/bin/intel64/Release/*.dll" | Copy-Item -Destination src-tauri/resources/
          Get-ChildItem -Path "$($openvinoDir.FullName)/runtime/3rdparty/tbb/bin/*.dll" -ErrorAction SilentlyContinue | Copy-Item -Destination src-tauri/resources/
          Remove-Item -Recurse -Force "openvino.zip", "openvino-extracted"

          # 4. CUDA Backend (NVIDIA GPU Acceleration)
          Write-Host "Building CUDA backend for Windows..."
          cmake -B whisper.cpp-src/build-cuda -S whisper.cpp-src -DCMAKE_BUILD_TYPE=Release -DGGML_CUDA=ON -DGGML_OPENMP=ON -DBUILD_SHARED_LIBS=OFF
          cmake --build whisper.cpp-src/build-cuda --config Release --target whisper-cli
          Copy-Item whisper.cpp-src/build-cuda/bin/Release/whisper-cli.exe src-tauri/resources/whisper-cli-cuda.exe

          # Copy CUDA runtime DLLs to resources so end-users don't need CUDA Toolkit installed
          if ($env:CUDA_PATH) {
            Copy-Item "$env:CUDA_PATH\bin\cublas64_*.dll" src-tauri/resources/ -ErrorAction SilentlyContinue
            Copy-Item "$env:CUDA_PATH\bin\cublasLt64_*.dll" src-tauri/resources/ -ErrorAction SilentlyContinue
            Copy-Item "$env:CUDA_PATH\bin\cudart64_*.dll" src-tauri/resources/ -ErrorAction SilentlyContinue
          }

      - name: Compile Whisper CLI (macOS Universal Native + Metal)
        if: matrix.platform == 'macos-latest' && steps.whisper-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p src-tauri/resources

          # 1. x86_64 Intel Build (Metal disabled on Intel cross)
          echo "Building x86_64 Intel binary..."
          cmake -B whisper.cpp-src/build-x64 -S whisper.cpp-src -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="x86_64" -DGGML_METAL=OFF -DBUILD_SHARED_LIBS=OFF
          cmake --build whisper.cpp-src/build-x64 -j$(sysctl -n hw.ncpu) --config Release --target whisper-cli

          # 2. ARM64 Apple Silicon Build (Metal Accelerated for M1-M4)
          echo "Building ARM64 Apple Silicon binary with Metal..."
          cmake -B whisper.cpp-src/build-arm64 -S whisper.cpp-src -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64" -DGGML_METAL=ON -DBUILD_SHARED_LIBS=OFF
          cmake --build whisper.cpp-src/build-arm64 -j$(sysctl -n hw.ncpu) --config Release --target whisper-cli

          # 3. Combine into Universal Mach-O Fat Binary
          echo "Creating Universal Mach-O binary..."
          lipo -create whisper.cpp-src/build-x64/bin/whisper-cli whisper.cpp-src/build-arm64/bin/whisper-cli -output src-tauri/resources/whisper-cli-standard

          cp src-tauri/resources/whisper-cli-standard src-tauri/resources/whisper-cli-vulkan
          cp src-tauri/resources/whisper-cli-standard src-tauri/resources/whisper-cli-openvino
          cp src-tauri/resources/whisper-cli-standard src-tauri/resources/whisper-cli-cuda

          chmod +x src-tauri/resources/whisper-cli-*
          codesign --force --sign - src-tauri/resources/whisper-cli-*

      # --- FFMPEG & FFPROBE BINARIES CACHING & DOWNLOAD ---

      - name: Cache FFmpeg Binaries
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: |
            src-tauri/resources/ffmpeg*
            src-tauri/resources/ffprobe*
          key: ffmpeg-${{ matrix.platform }}-${{ matrix.arch }}-v2

      - name: Download Static FFmpeg (Linux x86_64)
        if: matrix.platform == 'ubuntu-22.04' && steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p src-tauri/resources
          wget -q https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz
          tar -xJf ffmpeg-release-amd64-static.tar.xz --wildcards --strip-components=1 -C src-tauri/resources/ "ffmpeg-*-amd64-static/ffmpeg" "ffmpeg-*-amd64-static/ffprobe"
          rm -f ffmpeg-release-amd64-static.tar.xz
          chmod +x src-tauri/resources/ffmpeg src-tauri/resources/ffprobe

      - name: Download Static FFmpeg (Linux arm64)
        if: matrix.platform == 'ubuntu-24.04-arm' && steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p src-tauri/resources
          wget -q https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-arm64-static.tar.xz
          tar -xJf ffmpeg-release-arm64-static.tar.xz --wildcards --strip-components=1 -C src-tauri/resources/ "ffmpeg-*-arm64-static/ffmpeg" "ffmpeg-*-arm64-static/ffprobe"
          rm -f ffmpeg-release-arm64-static.tar.xz
          chmod +x src-tauri/resources/ffmpeg src-tauri/resources/ffprobe

      - name: Download Static FFmpeg (Windows x64 - Full Build)
        if: matrix.platform == 'windows-latest' && steps.ffmpeg-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri/resources
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-full.7z" -OutFile "ffmpeg.7z"
          7z x ffmpeg.7z -offmpeg-extracted -y
          $binFolder = Get-ChildItem -Path "ffmpeg-extracted" -Recurse -Directory -Filter "bin" | Select-Object -First 1
          Copy-Item -Path "$($binFolder.FullName)\ffmpeg.exe" -Destination "src-tauri/resources/ffmpeg.exe"
          Copy-Item -Path "$($binFolder.FullName)\ffprobe.exe" -Destination "src-tauri/resources/ffprobe.exe"
          Remove-Item -Recurse -Force "ffmpeg.7z", "ffmpeg-extracted"

      - name: Download Static FFmpeg & FFprobe (macOS Universal Native)
        if: matrix.platform == 'macos-latest' && steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p src-tauri/resources
          # 1. FFmpeg Universal Mach-O binary (ARM64 with SVT-AV1 + x86_64)
          curl -L -o ffmpeg-arm64.zip "https://ffmpeg.martin-riedl.de/download/macos/arm64/1785863997_9.0/ffmpeg.zip"
          unzip -q -o ffmpeg-arm64.zip -d ./ffmpeg-arm64-dir
          curl -L -o ffmpeg-x64.zip "https://evermeet.cx/ffmpeg/getrelease/zip"
          unzip -q -o ffmpeg-x64.zip -d ./ffmpeg-x64-dir
          lipo -create ./ffmpeg-arm64-dir/ffmpeg ./ffmpeg-x64-dir/ffmpeg -output src-tauri/resources/ffmpeg
          rm -rf ffmpeg-arm64.zip ffmpeg-x64.zip ./ffmpeg-arm64-dir ./ffmpeg-x64-dir

          # 2. FFprobe Universal Mach-O binary (ARM64 + x86_64)
          curl -L -o ffprobe-arm64.zip "https://ffmpeg.martin-riedl.de/download/macos/arm64/1785863997_9.0/ffprobe.zip"
          unzip -q -o ffprobe-arm64.zip -d ./ffprobe-arm64-dir
          curl -L -o ffprobe-x64.zip "https://evermeet.cx/ffmpeg/getrelease/ffprobe/zip"
          unzip -q -o ffprobe-x64.zip -d ./ffprobe-x64-dir
          lipo -create ./ffprobe-arm64-dir/ffprobe ./ffprobe-x64-dir/ffprobe -output src-tauri/resources/ffprobe
          rm -rf ffprobe-arm64.zip ffprobe-x64.zip ./ffprobe-arm64-dir ./ffprobe-x64-dir

          # 3. Fix permissions and ad-hoc code sign for Apple Silicon Gatekeeper
          chmod +x src-tauri/resources/ffmpeg src-tauri/resources/ffprobe
          codesign --force --sign - src-tauri/resources/ffmpeg
          codesign --force --sign - src-tauri/resources/ffprobe

      # --- TAURI APPLICATION BUNDLING & RELEASE ---

      - name: Extract App Version
        id: app_version
        shell: bash
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build Tauri Application
        run: npm run tauri build -- ${{ matrix.args }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NO_STRIP: true

      - name: Fix AppImage Graphics Libraries (Linux x86_64)
        if: matrix.platform == 'ubuntu-22.04'
        shell: bash
        run: |
          # 1. Download appimagetool from the official continuous release
          wget -q -O appimagetool https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool

          # 2. Extract appimagetool to bypass FUSE requirement on the runner
          ./appimagetool --appimage-extract
          mv squashfs-root appimagetool-temp

          # 3. Find the generated AppImage
          APPIMAGE_PATH=$(find src-tauri/target/release/bundle/appimage/ -name "*.AppImage" | head -n 1)
          echo "Found AppImage at: $APPIMAGE_PATH"

          # 4. Extract the app's AppImage
          chmod +x "$APPIMAGE_PATH"
          "$APPIMAGE_PATH" --appimage-extract
          
          # 5. Remove the conflicting graphics libraries from the extracted squashfs-root
          echo "Removing conflicting graphics libraries..."
          rm -f squashfs-root/usr/lib/libEGL.so*
          rm -f squashfs-root/usr/lib/libGL.so*
          rm -f squashfs-root/usr/lib/libgbm.so*
          rm -f squashfs-root/usr/lib/libglapi.so*
          rm -f squashfs-root/usr/lib/libwayland-client.so*
          
          rm -f squashfs-root/usr/lib/x86_64-linux-gnu/libEGL.so*
          rm -f squashfs-root/usr/lib/x86_64-linux-gnu/libGL.so*
          rm -f squashfs-root/usr/lib/x86_64-linux-gnu/libgbm.so*
          rm -f squashfs-root/usr/lib/x86_64-linux-gnu/libglapi.so*
          rm -f squashfs-root/usr/lib/x86_64-linux-gnu/libwayland-client.so*

          # 6. Remove the old AppImage file
          rm -f "$APPIMAGE_PATH"

          # 7. Re-package the AppImage using the extracted appimagetool
          echo "Re-packaging AppImage..."
          export ARCH=x86_64
          ./appimagetool-temp/AppRun squashfs-root "$APPIMAGE_PATH"

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ github.ref_name }}
          name: 'Whisper Desktop ${{ github.ref_name }}'
          body: |
            ## Whisper Desktop ${{ github.ref_name }} 🎙️

            A high-performance, private, and offline speech-to-text desktop application powered by `whisper.cpp` and `Tauri`.

            ### 📦 Download & Package Guide

            | Platform | Architecture / Format | Download | Notes |
            | :--- | :--- | :---: | :--- |
            | 🪟 **Windows** | Setup Installer (x64) | [![Download](https://img.shields.io/badge/Download-x64__setup.exe-0057d9?style=flat-square&logo=windows&logoColor=white)](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/WhisperDesktop_${{ steps.app_version.outputs.version }}_x64-setup.exe) | Compatible with Intel/AMD & Windows on ARM |
            | 🪟 **Windows** | MSI Package (x64) | [![Download](https://img.shields.io/badge/Download-x64__en--US.msi-0057d9?style=flat-square&logo=windows&logoColor=white)](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/WhisperDesktop_${{ steps.app_version.outputs.version }}_x64_en-US.msi) | Enterprise & System-wide deployment |
            | 🍎 **macOS** | Universal DMG | [![Download](https://img.shields.io/badge/Download-universal.dmg-0057d9?style=flat-square&logo=apple&logoColor=white)](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/WhisperDesktop_${{ steps.app_version.outputs.version }}_universal.dmg) | Native on Apple Silicon (M1-M4) & Intel |
            | 🐧 **Linux** | Portable AppImage (x86_64) | [![Download](https://img.shields.io/badge/Download-amd64.AppImage-0057d9?style=flat-square&logo=linux&logoColor=white)](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/WhisperDesktop_${{ steps.app_version.outputs.version }}_amd64.AppImage) | Standalone executable for Intel/AMD |
