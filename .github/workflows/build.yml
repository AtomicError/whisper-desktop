name: Build Cross-Platform App

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

jobs:
  build-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'ubuntu-22.04'
            arch: 'x86_64'
            args: ''
            rust-target: ''
          - platform: 'ubuntu-24.04-arm'
            arch: 'arm64'
            args: ''
            rust-target: ''
          - platform: 'windows-latest'
            arch: 'x86_64'
            args: ''
            rust-target: ''
          - platform: 'macos-latest'
            arch: 'universal'
            args: '--target universal-apple-darwin'
            rust-target: 'x86_64-apple-darwin,aarch64-apple-darwin'

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies (Ubuntu only)
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev rpm libglib2.0-dev pkg-config xdg-utils file

      - name: Install frontend dependencies
        run: npm ci

      - name: Cache FFmpeg Binaries
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: |
            src-tauri/resources/ffmpeg*
            src-tauri/resources/ffprobe*
          key: ffmpeg-${{ matrix.platform }}-${{ matrix.arch }}-v2

      - name: Download Static FFmpeg (Linux x86_64)
        if: matrix.platform == 'ubuntu-22.04' && steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p src-tauri/resources
          wget -q https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz
          tar -xJf ffmpeg-release-amd64-static.tar.xz --wildcards --strip-components=1 -C src-tauri/resources/ "ffmpeg-*-amd64-static/ffmpeg" "ffmpeg-*-amd64-static/ffprobe"
          rm -f ffmpeg-release-amd64-static.tar.xz
          chmod +x src-tauri/resources/ffmpeg src-tauri/resources/ffprobe

      - name: Download Static FFmpeg (Linux arm64)
        if: matrix.platform == 'ubuntu-24.04-arm' && steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p src-tauri/resources
          wget -q https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-arm64-static.tar.xz
          tar -xJf ffmpeg-release-arm64-static.tar.xz --wildcards --strip-components=1 -C src-tauri/resources/ "ffmpeg-*-arm64-static/ffmpeg" "ffmpeg-*-arm64-static/ffprobe"
          rm -f ffmpeg-release-arm64-static.tar.xz
          chmod +x src-tauri/resources/ffmpeg src-tauri/resources/ffprobe

      - name: Download Static FFmpeg (Windows x64 - Full Build)
        if: matrix.platform == 'windows-latest' && steps.ffmpeg-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri/resources
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-full.7z" -OutFile "ffmpeg.7z"
          7z x ffmpeg.7z -offmpeg-extracted -y
          $binFolder = Get-ChildItem -Path "ffmpeg-extracted" -Recurse -Directory -Filter "bin" | Select-Object -First 1
          Copy-Item -Path "$($binFolder.FullName)\ffmpeg.exe" -Destination "src-tauri/resources/ffmpeg.exe"
          Copy-Item -Path "$($binFolder.FullName)\ffprobe.exe" -Destination "src-tauri/resources/ffprobe.exe"
          Remove-Item -Recurse -Force "ffmpeg.7z", "ffmpeg-extracted"

      - name: Download Static FFmpeg & FFprobe (macOS Universal Native)
        if: matrix.platform == 'macos-latest' && steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p src-tauri/resources
          # 1. FFmpeg Universal Mach-O binary (ARM64 with SVT-AV1 + x86_64)
          curl -L -o ffmpeg-arm64.zip "https://ffmpeg.martin-riedl.de/download/macos/arm64/1785863997_9.0/ffmpeg.zip"
          unzip -q -o ffmpeg-arm64.zip -d ./ffmpeg-arm64-dir
          curl -L -o ffmpeg-x64.zip "https://evermeet.cx/ffmpeg/getrelease/zip"
          unzip -q -o ffmpeg-x64.zip -d ./ffmpeg-x64-dir
          lipo -create ./ffmpeg-arm64-dir/ffmpeg ./ffmpeg-x64-dir/ffmpeg -output src-tauri/resources/ffmpeg
          rm -rf ffmpeg-arm64.zip ffmpeg-x64.zip ./ffmpeg-arm64-dir ./ffmpeg-x64-dir

          # 2. FFprobe Universal Mach-O binary (ARM64 + x86_64)
          curl -L -o ffprobe-arm64.zip "https://ffmpeg.martin-riedl.de/download/macos/arm64/1785863997_9.0/ffprobe.zip"
          unzip -q -o ffprobe-arm64.zip -d ./ffprobe-arm64-dir
          curl -L -o ffprobe-x64.zip "https://evermeet.cx/ffmpeg/getrelease/ffprobe/zip"
          unzip -q -o ffprobe-x64.zip -d ./ffprobe-x64-dir
          lipo -create ./ffprobe-arm64-dir/ffprobe ./ffprobe-x64-dir/ffprobe -output src-tauri/resources/ffprobe
          rm -rf ffprobe-arm64.zip ffprobe-x64.zip ./ffprobe-arm64-dir ./ffprobe-x64-dir

          # 3. Fix permissions and ad-hoc code sign for Apple Silicon Gatekeeper
          chmod +x src-tauri/resources/ffmpeg src-tauri/resources/ffprobe
          codesign --force --sign - src-tauri/resources/ffmpeg
          codesign --force --sign - src-tauri/resources/ffprobe

      - name: Extract App Version
        id: app_version
        shell: bash
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build Tauri Application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Whisper Desktop ${{ github.ref_name }}'
          releaseBody: |
            ## Whisper Desktop ${{ github.ref_name }} 🎙️

            A high-performance, private, and offline speech-to-text desktop application powered by `whisper.cpp` and `Tauri`.

            ### 📦 Download & Package Guide

            | Platform | Architecture / Format | Download | Notes |
            | :--- | :--- | :---: | :--- |
            | 🪟 **Windows** | Setup Installer (x64) | [![Download](https://img.shields.io/badge/Download-x64__setup.exe-0057d9?style=flat-square&logo=windows&logoColor=white)](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/WhisperDesktop_${{ steps.app_version.outputs.version }}_x64-setup.exe) | Compatible with Intel/AMD & Windows on ARM |
            | 🪟 **Windows** | MSI Package (x64) | [![Download](https://img.shields.io/badge/Download-x64__en--US.msi-0057d9?style=flat-square&logo=windows&logoColor=white)](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/WhisperDesktop_${{ steps.app_version.outputs.version }}_x64_en-US.msi) | Enterprise & System-wide deployment |
            | 🍎 **macOS** | Universal DMG | [![Download](https://img.shields.io/badge/Download-universal.dmg-0057d9?style=flat-square&logo=apple&logoColor=white)](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/WhisperDesktop_${{ steps.app_version.outputs.version }}_universal.dmg) | Native on Apple Silicon (M1-M4) & Intel |
            | 🐧 **Linux** | Portable AppImage (x86_64) | [![Download](https://img.shields.io/badge/Download-amd64.AppImage-0057d9?style=flat-square&logo=linux&logoColor=white)](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/WhisperDesktop_${{ steps.app_version.outputs.version }}_amd64.AppImage) | Standalone executable for Intel/AMD |
            | 🐧 **Linux** | Portable AppImage (ARM64) | [![Download](https://img.shields.io/badge/Download-aarch64.AppImage-0057d9?style=flat-square&logo=linux&logoColor=white)](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/WhisperDesktop_${{ steps.app_version.outputs.version }}_aarch64.AppImage) | Standalone executable for ARM64 |
            | 🐧 **Linux (Debian/Ubuntu)** | DEB Package (Intel/AMD) | [![Download](https://img.shields.io/badge/Download-amd64.deb-0057d9?style=flat-square&logo=debian&logoColor=white)](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/WhisperDesktop_${{ steps.app_version.outputs.version }}_amd64.deb) | Standard package for Ubuntu/Debian |
            | 🐧 **Linux (Debian/Ubuntu)** | DEB Package (ARM64) | [![Download](https://img.shields.io/badge/Download-arm64.deb-0057d9?style=flat-square&logo=debian&logoColor=white)](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/WhisperDesktop_${{ steps.app_version.outputs.version }}_arm64.deb) | Standard package for ARM64 |
            | 🐧 **Linux (Fedora/RHEL)** | RPM Package (x86_64) | [![Download](https://img.shields.io/badge/Download-x86__64.rpm-0057d9?style=flat-square&logo=redhat&logoColor=white)](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/WhisperDesktop-${{ steps.app_version.outputs.version }}-1.x86_64.rpm) | Red Hat / Fedora / openSUSE |
            | 🐧 **Linux (Fedora/RHEL)** | RPM Package (ARM64) | [![Download](https://img.shields.io/badge/Download-aarch64.rpm-0057d9?style=flat-square&logo=redhat&logoColor=white)](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/WhisperDesktop-${{ steps.app_version.outputs.version }}-1.aarch64.rpm) | Red Hat / Fedora on ARM64 |

            ---
            > 💡 **Windows on ARM:** Windows 11 ARM64 devices (Snapdragon X Elite, Surface Pro, etc.) run the `x64-setup.exe` installer with near-native performance via Microsoft Prism emulation.
            > 💡 **macOS Universal:** The DMG package contains a Universal binary natively optimized for both Apple Silicon (M1/M2/M3/M4) and Intel Macs.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
