[package]
name = "whisper-desktop"
version = "2.3.0"
description = "A premium, state-of-the-art, and gorgeous native Rust & Tauri GUI designed for whisper.cpp"
authors = ["TheMrAhmad"]
homepage = "https://github.com/AtomicError/whisper-desktop"
repository = "https://github.com/AtomicError/whisper-desktop"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "whisper_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.30"
tokio = { version = "1", features = ["full"] }
regex = "1"
tauri-plugin-dialog = "2"
chrono = { version = "0.4", features = ["serde"] }
webkit2gtk = { version = "2.0.2" }
reqwest = { version = "0.12", features = ["json"] }
keyring = "2.1"



