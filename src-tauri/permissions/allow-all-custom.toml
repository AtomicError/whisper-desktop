[[permission]]
identifier = "allow-all-custom"
description = "Allow all custom Whisper Manager command invokes"

[permission.commands]
allow = [
  "get_system_stats",
  "load_settings",
  "save_settings",
  "apply_preset",
  "check_build",
  "probe_media_file",
  "convert_media_file",
  "start_transcription_task",
  "cancel_transcription",
  "copy_to_clipboard",
  "get_logs",
  "clear_logs",
  "scan_models",
  "select_file",
  "select_subtitle_file",
  "select_files",
  "select_directory",
  "get_system_fonts",
  "check_hardware_encoders",
  "start_hardsub_task",
  "read_text_file_content",
  "start_download_model_task",
  "get_model_download_progress",
  "get_all_models_status",
  "pause_download_model",
  "delete_model_file",
  "get_system_specs",
  "fetch_provider_models",
  "translate_transcription_files",
  "preview_translate_first_lines",
  "store_keyring_credential",
  "get_keyring_credential",
  "delete_keyring_credential",
  "write_text_file_content",
  "get_media_stream_url"
]
