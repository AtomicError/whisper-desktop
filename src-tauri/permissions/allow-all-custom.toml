[[permission]]
identifier = "allow-all-custom"
description = "Allow all custom Whisper Desktop command invokes"

[permission.commands]
allow = [
  "load_settings",
  "save_settings",
  "reset_whisper_core_settings",
  "check_build",
  "probe_media_file",
  "convert_media_file",
  "start_transcription_task",
  "cancel_transcription",
  "cancel_hardsub_task",
  "get_logs",
  "clear_logs",
  "scan_models",
  "select_file",
  "select_subtitle_file",
  "select_files",
  "select_directory",
  "verify_directory_writable",
  "get_system_fonts",
  "check_hardware_encoders",
  "get_font_render_scale",
  "start_hardsub_task",
  "read_text_file_content",
  "find_existing_video_file",
  "start_download_model_task",
  "get_all_models_status",
  "pause_download_model",
  "delete_model_file",
  "get_system_specs",
  "fetch_provider_models",
  "translate_transcription_files",
  "preview_translate_first_lines",
  "cancel_preview_translate",
  "get_translation_checkpoint_info",
  "clear_translation_checkpoint",
  "store_keyring_credential",
  "get_keyring_credential",
  "delete_keyring_credential",
  "write_text_file_content",
  "begin_hardsub_preview",
  "advance_hardsub_preview",
  "release_hardsub_preview",
  "probe_hardsub_source",
  "get_ffmpeg_status",
  "get_whisper_status",
  "copy_to_clipboard",
  "open_file_in_editor",
  "show_in_folder",
  "exit_app",
  "hide_to_tray",
  "set_window_zoom",
  "get_transcript_session_data",
  "stream_media_file",
  "revoke_media_stream"
]

